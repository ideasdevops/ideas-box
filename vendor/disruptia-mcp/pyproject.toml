[project]
name = "disruptia-mcp"
version = "0.1.0"
description = "MCP server: conecta Ideas Box con tu cuenta de DisruptIA (servicios, tickets de soporte y tienda). Solo clientes Enterprise con el plan Partner Creator."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "mcp>=1.2,<2",
]

[project.scripts]
disruptia-mcp = "disruptia_mcp.server:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["disruptia_mcp*"]
